name: tests

on:
  push:
  pull_request:

jobs:
  headless:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Cache Godot binary
        uses: actions/cache@v4
        with:
          path: .godot-bin
          key: godot-4.7.2-stable-linux
      - name: Import project
        run: tools/godot.sh --headless --path . --import || true
      - name: Unit tests
        run: tools/test.sh
      - name: Smoke boot (all planets)
        run: tools/smoke.sh 01 02 04
      - name: Co-op smoke (host + client)
        run: tools/nettest.sh
